<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayZ Editor Share - Baza Projektów Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px), 
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        }

        nav { background: rgba(31, 40, 51, 0.95); padding: 15px 30px; border-b: 1px solid #2d3748; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 900; color: #ef4444; letter-spacing: 2px; }
        .logo span { color: #ffffff; font-weight: 300; font-size: 18px; letter-spacing: 0; }
        .nav-buttons { display: flex; gap: 15px; }
        
        /* POPRAWIONY CZERWONY PRZYCISK (Usunięty błędny kod spacji) */
        .btn-add { background-color: #dc2626; color: white; border: none; padding: 10px 22px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2); display: inline-flex; align-items: center; justify-content: center; }
        .btn-add:hover { background-color: #b91c1c; transform: translateY(-1px); }
        .btn-login { background: transparent; color: white; border: 1px solid #4a5568; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { border-color: white; background: rgba(255,255,255,0.05); }

        header { position: relative; padding: 80px 20px; text-align: center; border-bottom: 1px solid #1a202c; background: radial-gradient(circle at center, rgba(239,68,68,0.03) 0%, transparent 70%); }
        .badge { background: rgba(153, 27, 27, 0.3); color: #f87171; border: 1px solid rgba(153, 27, 27, 0.5); font-size: 11px; font-weight: bold; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        h2 { color: white; font-size: 36px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: -0.5px; }
        header p { color: #94a3b8; max-width: 600px; margin: 0 auto 35px auto; font-size: 16px; line-height: 1.6; }
        .highlight { color: #f87171; font-weight: bold; }

        .search-panel { max-width: 900px; margin: 0 auto; background: #151a22; padding: 15px; border-radius: 16px; border: 1px solid rgba(74, 85, 104, 0.4); display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-input-wrapper { flex-grow: 1; }
        .search-panel input { width: 100%; background: rgba(31, 40, 51, 0.6); border: 1px solid #4a5568; border-radius: 10px; padding: 12px 15px; color: white; font-size: 14px; outline: none; transition: 0.3s; }
        .search-panel input:focus { border-color: #ef4444; }
        .search-panel select { background: rgba(31, 40, 51, 0.6); border: 1px solid #4a5568; border-radius: 10px; padding: 12px 15px; color: white; font-size: 14px; cursor: pointer; outline: none; min-width: 220px; max-width: 250px; }
        .search-panel select:focus { border-color: #ef4444; }

        main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 50px 20px; flex-grow: 1; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #2d3748; padding-bottom: 15px; }
        .main-header h3 { color: white; font-size: 22px; font-weight: 700; }
        .counter { color: #718096; font-size: 13px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        
        .card { background: #151a22; border-radius: 16px; overflow: hidden; border: 1px solid #2d3748; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { border-color: rgba(239, 68, 68, 0.3); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
        .card-image { height: 180px; background-size: cover; background-position: center; position: relative; background-color: #1a202c; }
        .badge-platform { position: absolute; top: 15px; left: 15px; background: rgba(220, 38, 38, 0.9); color: white; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px; }
        .badge-platform.pc { background: rgba(37, 99, 235, 0.9); }
        
        .card-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-tags { display: flex; gap: 8px; margin-bottom: 12px; }
        .tag { background: #1f2833; border: 1px solid rgba(74, 85, 104, 0.5); color: #a0aec0; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 6px; }
        .card h4 { color: white; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .card p { color: #a0aec0; font-size: 13px; line-height: 1.5; margin-bottom: 20px; font-weight: 300; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(45, 55, 72, 0.6); padding-top: 15px; }
        .author-info { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 28px; height: 28px; background: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
        .avatar.s { background: #2563eb; }
        .author-name { color: #cbd5e1; font-size: 12px; font-weight: 500; }
        .btn-download { background: #1f2833; color: #e2e8f0; border: 1px solid #4a5568; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-download:hover { background: #dc2626; color: white; border-color: #dc2626; }

        footer { background: #0b0c10; color: #4a5568; text-align: center; padding: 30px 20px; border-top: 1px solid #1a202c; font-size: 11px; line-height: 1.6; }
        footer p { max-width: 500px; margin: 0 auto; }
        footer .legal { color: #2d3748; margin-top: 5px; }

        @media (max-width: 768px) {
            .search-panel { flex-direction: column; }
            .search-panel select { width: 100%; max-width: 100%; }
            h2 { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- Nawigacja -->
    <nav>
        <div class="nav-container">
            <div class="logo">🎯 DAYZ <span>EDITOR SHARE</span></div>
            <div class="nav-buttons">
                <button class="btn-add">Dodaj Projekt</button>
                <button class="btn-login">Zaloguj się</button>
            </div>
        </div>
    </nav>

    <!-- Nagłówek główny -->
    <header>
        <div class="badge">Strefa Twórców Serwerów DayZ</div>
        <h2>Zmień wygląd swojego serwera</h2>
        <p>Przeglądaj i pobieraj darmowe, gotowe pliki <span class="highlight">.dze</span> oraz <span class="highlight">.json</span> stworzone przez społeczność dla graczy PC, PS4 oraz XBOX.</p>
        
        <!-- Wyszukiwarka i rozbudowane filtry map -->
        <div class="search-panel">
            <div class="search-input-wrapper">
                <input type="text" placeholder="Szukaj lokalizacji (np. Obóz Zelengorsk, Baza NWAF)...">
            </div>
            <select>

                    <option value="alteria">Alteria</option>

                    <option value="banov">Banov</option>
                    <option value="beringstrait">Bering Strait</option>
                    <option value="bitterroot">Bitterroot</option>
                    <option value="chara">Chara</option>
                    <option value="deerisle">Deer Isle</option>
                    <option value="enoch">Enoch</option>
                    <option value="esseker">Esseker</option>
                    <option value="grozovoy">Grozovoy Pass</option>
                    <option value="iztek">Iztek</option>
                    <option value="krasno">Krasnostav Territory</option>
                    <option value="melkart">Melkart</option>
                    <option value="namalsk">Namalsk</option>
                    <option value="nesta">Nesta</option>
                    <option value="rostow">Rostow</option>
                    <option value="pvp_arena">Shattered Skies (PvP)</option>
                    <option value="stalker_zone">Stalker Zone (Pripyat)</option>
                    <option value="swatowo">Swatowo</option>
                    <option value="takistan">Takistan Plus</option>
                    <option value="tanoa">Tanoa (DayZ)</option>
                    <option value="valning">Valning</option>
                    <option value="vostok">Vostok</option>
